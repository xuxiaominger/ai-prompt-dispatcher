<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Dispatcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#0f172a;
}
input, button {
    padding:15px;
    font-size:18px;
    border-radius:10px;
    margin:5px;
}
</style>
</head>
<body>

<div>
<input id="input" placeholder="Enter prompt">
<button onclick="go()">GO</button>
</div>

<script>
function go(){
    const text = document.getElementById("input").value.trim();
    if(!text) return;

    localStorage.setItem("prompt", text);
    window.open("open.html", "_blank");
}
</script>

</body>
</html>
