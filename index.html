<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Prompt Dispatcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
}
input {
    width: 80%;
    max-width: 600px;
    padding: 16px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    outline: none;
}
</style>
</head>
<body>

<input id="promptInput" placeholder="Type your AI prompt and press Enter..." autofocus>

<script>
const sites = [
    "https://chatgpt.com/",
    "https://yuanbao.tencent.com/chat/naQivTmsDa",
    "https://www.qianwen.com",
    "https://grok.com",
    "https://gemini.google.com/app",
    "https://www.kimi.com"
];

document.getElementById("promptInput").addEventListener("keydown", async function(e) {
    if (e.key === "Enter") {
        const prompt = this.value.trim();
        if (!prompt) return;

        try {
            await navigator.clipboard.writeText(prompt);
        } catch (err) {
            alert("Clipboard copy failed, please copy manually.");
        }

        alert("Prompt copied! Opening AI tools 🚀");

        sites.forEach(url => {
            window.open(url, "_blank");
        });
    }
});
</script>

</body>
</html>
